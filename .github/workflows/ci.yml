name: CI

# Two test surfaces gate this repo, both behind one path filter so neither spins up
# on a pure skills/agents/docs edit:
#   - mcp/    — the compiled TypeScript MCP server: npm ci -> tsc build -> vitest.
#   - hooks/  — zero-dependency CommonJS hook scripts with a node:test suite (no
#               package.json, no install): node --test over the test glob.
# The filter is workflow-level, so a change under either path runs BOTH jobs. The
# off-target job is cheap and passes untouched (its sources didn't change), so the
# wasted run isn't worth per-job path guards (paths-filter actions / separate files).

on:
  pull_request:
    paths:
      - "mcp/**"
      - "hooks/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - master
    paths:
      - "mcp/**"
      - "hooks/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  mcp:
    name: mcp build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      # Pin to the floor of the supported range (package.json engines: ">=20"),
      # not the latest. Catches "works on my newer local Node, breaks on minimum".
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      # npm ci requires a committed lockfile and installs exactly what it pins —
      # this is the reproducible half of the gate. Fails loudly if the lockfile
      # and package.json have drifted apart.
      - name: Install
        run: npm ci

      # build = tsc; type errors fail the gate.
      - name: Typecheck / build
        run: npm run build

      - name: Test
        run: npm test

  hooks:
    name: hooks test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same floor-pin rationale as the mcp job: node:test is stable on >=20.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # hooks/ is zero-dependency CommonJS — no package.json, so no install step.
      # Use the test glob, not the bare directory: `node --test hooks/test/`
      # has a directory-arg quirk that reports a spurious failure.
      - name: Test
        run: node --test hooks/test/*.test.js
